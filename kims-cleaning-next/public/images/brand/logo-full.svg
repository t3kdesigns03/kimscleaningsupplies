  .wordmark { font-family: "Fraunces", Georgia, "Times New Roman", serif; }
  .label    { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
</style>
<linearGradient id="ocean" x1=".12" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="#9ACB4E"/><stop offset=".42" stop-color="#4E9A36"/><stop offset="1" stop-color="#17471F"/></linearGradient>
<linearGradient id="land" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#23632B"/><stop offset="1" stop-color="#103A19"/></linearGradient>
<linearGradient id="gold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E3B400"/><stop offset=".55" stop-color="#F6DB45"/><stop offset="1" stop-color="#E8C316"/></linearGradient>
<linearGradient id="leafLight" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4E9A36"/><stop offset="1" stop-color="#8CC63F"/></linearGradient>
<linearGradient id="leafDeep" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1E5626"/><stop offset="1" stop-color="#3E8A2E"/></linearGradient>
<radialGradient id="shine" cx=".33" cy=".28" r=".72"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".20"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<clipPath id="globeClip"><circle cx="56" cy="64" r="44"/></clipPath>
</defs>

<!-- soft cream card -->
<rect x="6" y="6" width="1028" height="548" rx="26" fill="#F7F3E8" stroke="#E4DCC9" stroke-width="2"/>

