<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="Kim's Cleaning Supplies — Premium. Sustainable. Proven.">
<title>Kim's Cleaning Supplies</title>
<defs>
<style>
