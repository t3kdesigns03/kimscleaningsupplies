<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* A 404 can be served from any depth (/shop/old-link/whatever), so the site
   root has to be worked out before any relative stylesheet or script loads.
   If you ever rename the repository, change REPO to match — nothing else in
   the site needs it. */
(function () {
  var REPO = "kimscleaningsupplies";
  var path = location.pathname;
  var at = path.indexOf("/" + REPO + "/");
  document.write('<base href="' + (at >= 0 ? path.slice(0, at + REPO.length + 2) : "/") + '">');
})();
</script>
