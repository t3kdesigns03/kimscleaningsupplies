<!-- ===== wordmark ===== -->
<text x="392" y="286" class="wordmark" font-size="150" font-weight="600" fill="#1E4A22" letter-spacing="-1">Kim&#8217;s</text>
<text x="398" y="352" class="label" font-size="46" font-weight="700" fill="#5C9A3A" letter-spacing="9">CLEANING SUPPLIES</text>
<text x="401" y="392" class="label" font-size="21" font-weight="600" fill="#2F6B32" letter-spacing="5" opacity=".85">MADE IN USA</text>

<!-- ===== tagline ===== -->
<g>
  <line x1="430" y1="452" x2="610" y2="452" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <text x="520" y="500" text-anchor="middle" class="label" font-size="28" font-weight="700" fill="#2F6B32" letter-spacing="7">PREMIUM. SUSTAINABLE. PROVEN.</text>
