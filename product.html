<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kim's Cleaning Supplies</title>
<meta name="description" content="Microfiber that cleans with water only. Made in USA.">
<link rel="icon" href="images/brand/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>

<main>
  <section class="tight">
    <div class="wrap">
      <p class="small" style="margin-bottom:18px"><a href="shop.html">&larr; Back to the shop</a></p>
      <div class="pdp" id="pdp"></div>
    </div>
  </section>
</main>

<div class="sticky-bar hide" id="sticky">
  <span class="sb-price" id="sb-price"></span>
  <button class="btn btn-primary" type="button" id="sb-add">Add to cart</button>
</div>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/ui.js"></script>
<script src="js/cart.js"></script>
<script>
(function () {
  KIMS.mount("shop.html");

  var pdp = document.getElementById("pdp");
  var slug = KIMS.param("id");
  var p = KIMS.bySlug(slug);

  if (!p) {
    pdp.innerHTML =
      '<div style="grid-column:1/-1" class="empty">' +
        "<h1>We can't find that one</h1>" +
        '<p class="muted">It may have been renamed. Everything Kim sells is on the shop page.</p>' +
        '<a class="btn btn-primary" href="shop.html">Go to the shop</a>' +
      "</div>";
    document.title = "Not found — Kim's Cleaning Supplies";
    return;
  }

  document.title = p.name + " — Kim's Cleaning Supplies";
  var metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute("content", p.blurb);

  var cloths = KIMS.products().filter(function (x) { return x.category === "cloths"; });
  var isCloth = p.category === "cloths";
  var care = KIMS_CARE[p.care] || KIMS_CARE.wet;
  var dryOnly = p.care === "dry";

  /* ---------------- markup ---------------- */
  var optionHtml = "";
  if (p.options) {
    optionHtml =
      '<label class="field"><span>' + KIMS.esc(p.optionLabel || "Option") + '</span>' +
      '<select id="pdp-option">' +
        p.options.map(function (o) {
          return '<option value="' + KIMS.esc(o.value) + '"' + (o.soldOut ? " disabled" : "") + ">" +
            KIMS.esc(o.label) + (o.soldOut ? " — out of stock" : "") + "</option>";
        }).join("") +
      "</select></label>";
  }

  var compareHtml = "";
  if (isCloth) {
    compareHtml =
      '<div class="panel"><h3>Which pack is the better buy?</h3>' +
      '<table class="compare"><thead><tr><th>Pack</th><th>Price</th><th>Per cloth</th></tr></thead><tbody>' +
      cloths.map(function (c) {
        var each = c.price / c.packOf;
        var best = c.slug === "cloth-18";
        return '<tr data-current="' + (c.slug === p.slug) + '">' +
          "<td>" + (c.slug === p.slug ? "<strong>" + c.packOf + " pack</strong>" :
            '<a href="product.html?id=' + c.slug + '">' + c.packOf + " pack</a>") + "</td>" +
          "<td>" + KIMS.money(c.price) + "</td>" +
          "<td>" + KIMS.money(each) + (best ? '<span class="best">Best value</span>' : "") + "</td></tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  pdp.innerHTML =
    '<div class="gallery" id="gallery">' +
      '<div class="gallery-frame"><img id="gal-img" alt="' + KIMS.esc(p.name) + '"></div>' +
      '<button class="gal-nav gal-prev hide" type="button" id="gal-prev" aria-label="Previous picture">' + KIMS.icon.left + "</button>" +
      '<button class="gal-nav gal-next hide" type="button" id="gal-next" aria-label="Next picture">' + KIMS.icon.right + "</button>" +
      '<div class="dots" id="gal-dots"></div>' +
    "</div>" +

    "<div>" +
      "<h1>" + KIMS.esc(p.name) + "</h1>" +
      '<span class="price">' + KIMS.money(p.price) + "</span>" +
      '<p class="muted" style="margin-top:10px">' + KIMS.esc(p.blurb) + "</p>" +
      "<p>" + KIMS.esc(p.desc) + "</p>" +

      '<ul class="facts">' + p.bullets.map(function (b) { return "<li>" + KIMS.esc(b) + "</li>"; }).join("") + "</ul>" +

      '<div class="rule"></div>' +
      optionHtml +

      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px">' +
        '<div class="qty">' +
          '<button type="button" id="q-minus" aria-label="One fewer">&minus;</button>' +
          '<input id="q-input" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="Quantity">' +
          '<button type="button" id="q-plus" aria-label="One more">+</button>' +
        "</div>" +
        '<button class="btn btn-primary" type="button" id="add-btn" style="flex:1 1 200px">Add to cart</button>' +
      "</div>" +

      compareHtml +

      '<div class="panel' + (dryOnly ? " warn" : "") + '" style="margin-top:16px">' +
        "<h3>Looking after it</h3>" +
        '<ul class="facts">' + care.map(function (c) { return "<li>" + KIMS.esc(c) + "</li>"; }).join("") + "</ul>" +
      "</div>" +

      (isCloth ?
        '<div class="panel" style="margin-top:16px"><h3>The cloth itself</h3>' +
        '<ul class="facts">' + KIMS_CLOTH_FACTS.map(function (f) { return "<li>" + KIMS.esc(f) + "</li>"; }).join("") + "</ul>" +
        '<p class="small muted" style="margin:12px 0 0"><strong>Cleans:</strong> ' +
          KIMS_SURFACES.join(", ") + ".</p>" +
        '<p class="small muted" style="margin:6px 0 0"><strong>Removes:</strong> ' +
          KIMS_REMOVES.join(", ") + ".</p></div>"
        : "") +

      '<p class="small muted" style="margin-top:18px">' +
        'Shipping is a flat ' + KIMS.money(KIMS_CONFIG.flatShipping) + ', or choose free pickup in Quincy at checkout.' +
      "</p>" +
    "</div>";

  /* ---------------- gallery ---------------- */
  var img = document.getElementById("gal-img");
  var dots = document.getElementById("gal-dots");
  var prev = document.getElementById("gal-prev");
  var next = document.getElementById("gal-next");
  var slides = [];
  var at = 0;

  img.src = p.images[0];

  KIMS.resolveImages(p.images, function (found) {
    slides = found.length ? found : [p.images[0]];
    at = 0;
    show(0);
    if (slides.length > 1) {
      prev.classList.remove("hide");
      next.classList.remove("hide");
      dots.innerHTML = slides.map(function (_, i) {
        return '<button class="dot" type="button" data-i="' + i + '" aria-label="Picture ' + (i + 1) + '"></button>';
      }).join("");
      dots.addEventListener("click", function (e) {
        var d = e.target.closest("[data-i]");
        if (d) show(+d.dataset.i);
      });
    }
  });

  function show(i) {
    if (!slides.length) return;
    at = (i + slides.length) % slides.length;
    img.src = slides[at];
    Array.prototype.forEach.call(dots.children, function (d, k) {
      d.setAttribute("aria-current", String(k === at));
    });
  }
  prev.addEventListener("click", function () { show(at - 1); });
  next.addEventListener("click", function () { show(at + 1); });

  /* swipe */
  var x0 = null;
  document.getElementById("gallery").addEventListener("touchstart", function (e) {
    x0 = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById("gallery").addEventListener("touchend", function (e) {
    if (x0 === null || slides.length < 2) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) show(at + (dx < 0 ? 1 : -1));
    x0 = null;
  });

  /* ---------------- quantity + add ---------------- */
  var qEl = document.getElementById("q-input");
  function qty() { return Math.min(99, Math.max(1, parseInt(qEl.value, 10) || 1)); }
  function setQ(n) { qEl.value = Math.min(99, Math.max(1, n)); sync(); }
  document.getElementById("q-minus").addEventListener("click", function () { setQ(qty() - 1); });
  document.getElementById("q-plus").addEventListener("click", function () { setQ(qty() + 1); });
  qEl.addEventListener("change", function () { setQ(qty()); });

  function variant() {
    var s = document.getElementById("pdp-option");
    return s ? s.value : "";
  }

  function add() {
    Cart.add(p.slug, qty(), variant());
    KIMS.toast(qty() > 1 ? qty() + " added to cart" : p.name + " added to cart");
  }
  document.getElementById("add-btn").addEventListener("click", add);
  document.getElementById("sb-add").addEventListener("click", add);

  /* ---------------- sticky mobile bar ---------------- */
  var sticky = document.getElementById("sticky");
  var sbPrice = document.getElementById("sb-price");
  sticky.classList.remove("hide");
  function sync() { sbPrice.textContent = KIMS.money(p.price * qty()); }
  sync();
})();
</script>
</body>
</html>
